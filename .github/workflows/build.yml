name: Build APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Unpack project zip
        run: |
          mkdir -p work
          unzip -q ./*.zip -d work
          DIR=$(dirname "$(find work -name settings.gradle | head -1)")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: cd "$PROJECT_DIR" && gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MYRA-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
